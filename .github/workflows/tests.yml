name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: unit and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Run the tests (cleaning, leakage, embargo, metrics, API, drift gate, segments)
        run: python -m pytest -q

  docker:
    name: container builds and serves
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t inactivity-api:ci .
      - name: Start the container
        run: docker run -d --name api -p 8000:8000 inactivity-api:ci
      - name: Wait for the health check and score one customer
        run: |
          for i in $(seq 1 40); do
            if curl -fs http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl -fs http://localhost:8000/health || { docker logs api; exit 1; }
          curl -fs -X POST http://localhost:8000/score -H "Content-Type: application/json" \
            -d '{"snapshot_date":"2011-08-31","features":{"recency_days":20,"n_purchase_days":6}}' | grep -q probability_inactive \
            || { docker logs api; exit 1; }
      - name: Container logs
        if: always()
        run: docker logs api
